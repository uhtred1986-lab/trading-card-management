# The checks that need no database, plus one that needs only the GitHub API.
#
# `npm test` is the rules engine and the migrations on PGlite; the Kotlin job
# is tier 0 of `docs/arena-android-spec.md` §10 — it decodes the golden
# fixtures the server emits and proves a client still understands them.
#
# Those two are separate jobs on purpose. When the server's Snapshot shape
# changes, exactly one of them goes red, and which one tells you whether the
# change was deliberate (fixtures regenerated, Kotlin not yet updated) or an
# accident (neither updated).
#
# The Kotlin job runs only when the contract can have changed (#376): every
# push to `main`, and a pull request whose diff touches the paths in the
# `changes` job below. A job skipped by `if:` reports as skipped, which
# satisfies branch protection; a workflow-level `paths:` filter would leave a
# required check pending forever, so it is not used.
#
# `backlog` is `scripts/sync-arena-backlog.mts --check` (`docs/arena-backlog.md`
# §6): read-only against the GitHub API via the workflow's own `GITHUB_TOKEN`,
# it catches a backlog file whose `status:` disagrees with the issue's state
# and a `**Source:**` citation whose path no longer exists in the tree — the
# drift the review of 12 Sep 2026 found by hand.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: did the contract change
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs both the PR's base and head commits.
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push to main always runs the Kotlin job.
          if [ "$EVENT" != "pull_request" ]; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the Kotlin job reads is android/ and contract/fixtures/. What can
          # change those is the emitter `npm run contract:emit`
          # (scripts/verify-arena.ts --emit, which writes from scripts/verify/
          # contract.ts, language.ts and probe.ts) and everything they import:
          # all of src/lib/arena/ (snapshot and view are only two of the 85 files
          # in the closure), src/lib/decks/, src/lib/ai/client.ts,
          # src/lib/catalog/games.ts and src/db/ (pulled in through
          # decks/queries and the harness), plus scripts/verify/ itself.
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          if grep -qE '^(android/|contract/|scripts/verify-arena\.ts$|scripts/verify/|src/lib/arena/|src/lib/decks/|src/lib/ai/client\.ts$|src/lib/catalog/games\.ts$|src/db/|\.github/workflows/checks\.yml$)' changed.txt; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "contract=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: types, lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # No DATABASE_URL and no network: verify-rules and verify-arena are pure,
      # and verify-db runs the migrations on PGlite in-process.
      - run: npm test
      # The only build check now that Vercel builds `main` alone. DATABASE_URL points
      # nowhere: the build never connects (src/db/index.ts only reads it at import).
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
      - name: arena backlog drift
        run: npx tsx scripts/sync-arena-backlog.mts --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: the contract, from the Kotlin side
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Straight to Gradle rather than through Docker: the container exists so
      # the owner's machine needs no JDK, and a runner that already has one
      # should not pay to build an image.
      - run: gradle --no-daemon :contract:test
        working-directory: android
