# The checks that need neither a database nor a network.
#
# `npm test` is the rules engine and the migrations on PGlite; the Kotlin job
# is tier 0 of `docs/arena-android-spec.md` §10 — it decodes the golden
# fixtures the server emits and proves a client still understands them.
#
# The two are separate jobs on purpose. When the server's Snapshot shape
# changes, exactly one of them goes red, and which one tells you whether the
# change was deliberate (fixtures regenerated, Kotlin not yet updated) or an
# accident (neither updated).
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # No DATABASE_URL and no network: verify-rules and verify-arena are pure,
      # and verify-db runs the migrations on PGlite in-process.
      - run: npm test

  contract:
    name: the contract, from the Kotlin side
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Straight to Gradle rather than through Docker: the container exists so
      # the owner's machine needs no JDK, and a runner that already has one
      # should not pay to build an image.
      - run: gradle --no-daemon :contract:test
        working-directory: android
