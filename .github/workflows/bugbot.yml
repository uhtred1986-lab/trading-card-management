# Reviews every PR's diff for bugs and acceptance-criteria gaps, posting inline
# comments. Third-party action (not Anthropic/GitHub) — pinned to a commit SHA,
# not a movable tag, so a future push to the v1.0.14 tag can't change what runs
# here unreviewed.
#
# The job is red when no BugBot review was posted on the PR's head commit
# (issue #311). The action reports success even when its own Claude CLI never
# ran — an expired setup token, or the account's usage limit ("You've hit your
# session limit · resets …") — and a green job with no review would satisfy a
# merge rule that reads "BugBot says no bugs" without anything having been
# reviewed. A missing review is therefore a failure whatever the step's exit
# code said; the guard step names the likely cause and the fix is to re-run
# the job once the limit has reset. A PR whose every changed file is under
# .github/ is the one exception: the action strips those paths and reviews
# nothing, so no review is expected and the job stays green.
name: Claude BugBot

on:
  pull_request:
    types: [opened, synchronize]
  # Lets an already-open PR (one that predates this workflow, or that needs a
  # re-run without a new commit) be reviewed on demand from the Actions tab.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

permissions:
  contents: read
  # pull-requests: write is required for posting inline review comments and
  # auto-resolving threads when a bug is fixed in a follow-up commit. Also
  # requires Settings -> Actions -> General -> Workflow permissions -> "Read
  # and write permissions" in the repo, or this is silently downgraded.
  pull-requests: write

jobs:
  bugbot:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # The action reads `pull_request` off the triggering event payload,
      # which workflow_dispatch doesn't carry. Fetch the PR and check out its
      # head so a manual run looks the same as a real pull_request event.
      - name: Resolve PR for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" > "$RUNNER_TEMP/pr.json"
          HEAD_SHA=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          jq -n --slurpfile pr "$RUNNER_TEMP/pr.json" '{pull_request: $pr[0]}' > "$RUNNER_TEMP/event.json"
          echo "GITHUB_EVENT_PATH=$RUNNER_TEMP/event.json" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && env.HEAD_SHA || github.event.pull_request.head.sha }}
          # Full history so BugBot's history lens can check whether the PR
          # silently undoes an earlier fix.
          fetch-depth: 0

      - name: Run Claude BugBot
        # rekpero/claude-bugbot-github-action, tag v1.0.14, pinned by commit SHA.
        uses: rekpero/claude-bugbot-github-action@8eedc356796c3b6e73a2d2288fe10643702b8bfb
        with:
          claude-setup-token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          model: sonnet

      # The action's own exit code is not a verdict (see the header). A review
      # whose body carries the BugBot heading, on this exact head commit, is.
      - name: Require a BugBot review on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          HEAD: ${{ github.event_name == 'workflow_dispatch' && env.HEAD_SHA || github.event.pull_request.head.sha }}
        run: |
          # The action strips every path under .github/ before it looks at the
          # diff (its EXCLUDED_PATH_PREFIXES) and, left with nothing, logs
          # "Empty diff, nothing to analyze" and posts no review. That is not a
          # failure — a workflow-only PR has nothing for BugBot to read — so the
          # review is required only when the PR touches a file outside .github/.
          analyzable=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '[.[] | select(.filename | startswith(".github/") | not)] | length' | paste -sd+ - | bc)
          if [ "${analyzable:-0}" -eq 0 ]; then
            echo "Every changed file is under .github/, which the action excludes — nothing for BugBot to analyze, so no review is expected."
            exit 0
          fi
          # One page of 100 is every review a PR here has ever had; --paginate
          # would print one count per page.
          count=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq "[.[] | select(.commit_id == \"$HEAD\" and (.body | contains(\"Claude BugBot Analysis\")))] | length")
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No BugBot review was posted on $HEAD. The action reports success even when its Claude CLI never ran (usage limit, expired setup token) — read the 'Run Claude BugBot' step above for the cause, and re-run this job once the limit has reset."
            exit 1
          fi
          echo "BugBot posted $count review(s) on $HEAD."
