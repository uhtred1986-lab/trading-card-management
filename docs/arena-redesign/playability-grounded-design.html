  border: 2px solid #ffa73361;
  border-radius: 50%;
  width: min(420px, 96%);
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-fx-burst {
    border: 2px solid color-mix(in srgb, var(--color-ki-400) 38%, transparent);
  }
}

.arena-fx-burst {
  background: radial-gradient(circle, #0000 52%, #f28c0f24 70%, #0000 71%);
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-fx-burst {
    background: radial-gradient(circle, transparent 52%, color-mix(in srgb, var(--color-ki-500) 14%, transparent) 70%, transparent 71%);
  }
}

.arena-fx-lines {
  display: none;
}

@keyframes arena-fx-beam {
  from {
    transform: rotate(var(--ang)) scaleX(0);
    opacity: 1;
  }

  to {
    transform: rotate(var(--ang)) scaleX(1);
    opacity: 1;
  }
}

@keyframes arena-fx-fade {
  to {
    opacity: 0;
  }
}

.arena-fx-beam {
  transform-origin: 0;
  background: linear-gradient(90deg, var(--color-ki-400), #fff 15%, var(--color-ki-300) 50%, #fff 85%, var(--color-ki-400));
  height: 18px;
  box-shadow: 0 0 0 2px var(--ink, var(--color-ki-600));
  filter: drop-shadow(0 0 10px var(--color-ki-400));
  pointer-events: none;
  animation: arena-fx-beam var(--fx-beam, .36s) ease-out both,
    arena-fx-fade .32s ease-in var(--fx-word, .64s) forwards;
  border-radius: 9px;
  margin-top: -9px;
  position: absolute;
}

@keyframes arena-fx-shield {
  0% {
    opacity: 0;
    transform: scale(.4);
  }

  40% {
    opacity: 1;
    transform: scale(1.08);
  }

  100% {
    opacity: .85;
    transform: scale(1);
  }
}

.arena-fx-shield {
  border: 4px solid #76a8f9;
  border-radius: 50%;
  position: absolute;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-fx-shield {
    border: 4px solid color-mix(in srgb, var(--color-dbs-blue) 70%, #fff);
  }
}

.arena-fx-shield {
  box-shadow: 0 0 0 2px var(--ink, var(--color-space-950)),
    0 0 26px var(--color-dbs-blue);
  background: radial-gradient(circle, #0000 50%, #3b82f673 100%);
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-fx-shield {
    background: radial-gradient(circle, transparent 50%, color-mix(in srgb, var(--color-dbs-blue) 45%, transparent) 100%);
  }
}

.arena-fx-shield {
  pointer-events: none;
  animation: arena-fx-shield var(--fx-shield, .62s) ease-out var(--fx-beam, .36s) both;
}

@keyframes arena-fx-spin {
  to {
    transform: rotate(360deg);
  }
}

.arena-fx-rays {
  z-index: -1;
  pointer-events: none;
  background: repeating-conic-gradient(from 0deg, #ffc46b38 0 10deg, transparent 10deg 20deg);
  border-radius: 50%;
  width: 900px;
  height: 900px;
  margin: -450px 0 0 -450px;
  position: absolute;
  top: 50%;
  left: 50%;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-fx-rays {
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--color-ki-300) 22%, transparent) 0 10deg, transparent 10deg 20deg);
  }
}

.arena-fx-rays {
  animation: 24s linear infinite arena-fx-spin;
  -webkit-mask-image: radial-gradient(circle, #000 12%, #0000 60%);
  mask-image: radial-gradient(circle, #000 12%, #0000 60%);
}

.arena-fx-title {
  animation: arena-fx-slam var(--fx-title, .64s) cubic-bezier(.2, 1.6, .35, 1) both;
  display: block;
}

@keyframes arena-clash-fade {
  from {
    opacity: 0;
  }
}

@keyframes arena-clash-in-top {
  from {
    opacity: 0;
    transform: translate(-120%, -40px)rotate(-8deg);
  }
}

@keyframes arena-clash-in-bot {
  from {
    opacity: 0;
    transform: translate(120%, 40px)rotate(8deg);
  }
}

@keyframes arena-clash-pop {
  0% {
    filter: brightness(3);
    opacity: 0;
    transform: translateY(-20px)scale(2.2);
  }

  100% {
    opacity: 1;
    transform: none;
  }
}

.arena-fight {
  z-index: 20;
  isolation: isolate;
  animation: arena-clash-fade var(--fx-vs-delay, .18s) ease-out both;
  background: radial-gradient(90% 70%, #161e4e, #03050e);
  border-radius: 12px;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
  gap: 6px;
  padding: 10px 8px;
  display: flex;
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.arena-fight .arena-fx-burst {
  background: repeating-conic-gradient(from 0deg, #ffc46b99 0 8deg, transparent 8deg 22deg);
  border: 0;
  width: 280px;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-fight .arena-fx-burst {
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--color-ki-300) 60%, transparent) 0 8deg, transparent 8deg 22deg);
  }
}

.arena-fight .arena-fx-burst {
  animation: 6s linear infinite reverse arena-fx-spin;
  -webkit-mask-image: radial-gradient(circle, #0000 34%, #000 36% 58%, #0000 70%);
  mask-image: radial-gradient(circle, #0000 34%, #000 36% 58%, #0000 70%);
}

.arena-fight .arena-fx-lines {
  background: repeating-conic-gradient(from 0deg at 50% 50%, #ffffff1a 0 1.2deg, transparent 1.2deg 9deg);
  animation: 10s linear infinite arena-fx-spin;
  display: block;
  position: absolute;
  inset: -60%;
  -webkit-mask-image: radial-gradient(circle, #0000 16%, #000 50%);
  mask-image: radial-gradient(circle, #0000 16%, #000 50%);
}

.arena-clash-side {
  z-index: 2;
  align-items: center;
  gap: 16px;
  max-width: 100%;
  display: flex;
  position: relative;
}

.arena-clash-top {
  --glow: var(--color-dbs-blue);
  animation: arena-clash-in-top var(--fx-card-in, .46s) cubic-bezier(.2, .9, .2, 1.15) both;
}

.arena-clash-bot {
  --glow: var(--color-ki-500);
  animation: arena-clash-in-bot var(--fx-card-in, .46s) cubic-bezier(.2, .9, .2, 1.15) both;
}

.arena-clash-meta {
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-width: 0;
  max-width: 13.5rem;
  display: flex;
}

.arena-clash-role {
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--color-space-300);
  font-size: 11px;
  font-weight: 800;
}

.arena-clash-pow, .arena-clash-vs, .arena-verdict-word, .arena-end-title {
  font-family: var(--font-impact), "Kanit", var(--font-sans, system-ui), sans-serif;
  paint-order: stroke fill;
  font-style: italic;
  font-weight: 900;
  line-height: 1;
}

.arena-clash-pow {
  font-variant-numeric: tabular-nums;
  color: #fff;
  -webkit-text-stroke: 1.5px #000;
  text-shadow: 0 0 20px var(--glow);
  font-size: 38px;
}

.arena-clash-combos {
  flex-wrap: wrap;
  gap: 4px;
  display: flex;
}

.arena-clash-combo {
  text-align: left;
  color: var(--color-space-100);
  background: #192b4f;
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-clash-combo {
    background: color-mix(in srgb, var(--color-dbs-blue) 22%, var(--color-space-900));
  }
}

.arena-clash-combo {
  box-shadow: 0 0 0 1px #76a8f9;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-clash-combo {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-dbs-blue) 70%, #fff);
  }
}

.arena-clash-combo {
  animation: arena-clash-pop calc(var(--fx-vs, .52s)) cubic-bezier(.2, 1.6, .4, 1) both;
}

.arena-clash-combo-pending {
  box-shadow: none;
  outline: 2px dashed var(--color-ki-300);
  outline-offset: -2px;
  color: var(--color-ki-300);
  background: none;
}

.arena-clash-counter {
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #fff;
  background: var(--color-loss);
  border-radius: 3px;
  margin-right: 4px;
  padding: 0 3px;
  font-size: 9px;
}

.arena-clash-vs {
  z-index: 3;
  color: #fff;
  -webkit-text-stroke: 2px #000;
  text-shadow: 0 0 30px var(--color-ki-500);
  font-size: 46px;
  position: relative;
}

.arena-clash-note {
  z-index: 3;
  text-align: center;
  max-width: 100%;
  min-height: 1.2em;
  color: var(--color-space-300);
  font-size: 13px;
  font-weight: 600;
  position: relative;
}

.arena-clash-boom {
  transform: scale(2.1);
}

.arena .arena-slot.arena-slot-lifted {
  background: none;
  border-color: #0000;
}

@media (min-width: 1024px) {
  .arena-fight .arena-fx-burst {
    width: 440px;
  }

  .arena-clash-pow {
    font-size: 60px;
  }

  .arena-clash-vs {
    font-size: 80px;
  }

  .arena-clash-meta {
    max-width: 22rem;
  }

  .arena-clash-boom {
    transform: scale(2.8);
  }
}

@keyframes arena-verdict-burst {
  0% {
    opacity: 0;
    transform: scale(.2)rotate(0);
  }

  40% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform: scale(1)rotate(25deg);
  }
}

.arena-verdict-slot {
  z-index: 46;
  pointer-events: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 0 6px;
  display: flex;
  position: absolute;
  inset: 0;
  overflow: hidden;
  container-type: inline-size;
}

.arena-verdict-burst {
  aspect-ratio: 1;
  --burst: var(--color-ki-300);
  background: radial-gradient(circle, #ffffffe6 0 6%, var(--burst) 20%, transparent 46%),
    repeating-conic-gradient(from 0deg, var(--burst) 0 8deg, transparent 8deg 22deg);
  border-radius: 50%;
  width: 340px;
  margin: -170px 0 0 -170px;
  position: absolute;
  top: 50%;
  left: 50%;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-verdict-burst {
    background: radial-gradient(circle, #ffffffe6 0 6%, color-mix(in srgb, var(--burst) 70%, transparent) 20%, transparent 46%),
    repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--burst) 60%, transparent) 0 8deg, transparent 8deg 22deg);
  }
}

.arena-verdict-burst {
  animation: arena-verdict-burst var(--fx-word, .64s) cubic-bezier(.2, 1.2, .35, 1) var(--fx-beam, .36s) both;
  -webkit-mask-image: radial-gradient(circle, #000 28%, #0000 68%);
  mask-image: radial-gradient(circle, #000 28%, #0000 68%);
}

.arena-verdict-calm .arena-verdict-burst {
  --burst: #76a8f9;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-verdict-calm .arena-verdict-burst {
    --burst: color-mix(in srgb, var(--color-dbs-blue) 70%, #fff);
  }
}

.arena-verdict-bad .arena-verdict-burst {
  --burst: var(--color-loss);
}

.arena-verdict-word {
  white-space: nowrap;
  text-align: center;
  letter-spacing: .01em;
  -webkit-text-stroke: 2px #000;
  max-width: 100%;
  font-size: min(46px, 8.6cqw);
  position: relative;
}

.arena-verdict-good .arena-verdict-word {
  color: var(--color-ki-300);
  text-shadow: 0 0 34px var(--color-ki-500);
}

.arena-verdict-bad .arena-verdict-word {
  color: #ff9aa4;
  text-shadow: 0 0 34px var(--color-loss);
}

.arena-verdict-calm .arena-verdict-word {
  color: #bdefff;
  text-shadow: 0 0 34px var(--color-dbs-blue);
}

.arena-verdict-line {
  color: var(--color-space-200);
  font-size: 13px;
  font-weight: 600;
  position: relative;
}

@media (min-width: 1024px) {
  .arena-verdict-word {
    font-size: min(84px, 8.6cqw);
  }

  .arena-verdict-burst {
    width: 560px;
    margin: -280px 0 0 -280px;
  }
}

.arena-end {
  z-index: 60;
  isolation: isolate;
  background: #03050ed1;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
  padding: 16px;
  animation: .4s ease-out both arena-clash-fade;
  display: flex;
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.arena-end-rays {
  z-index: -1;
  pointer-events: none;
  background: repeating-conic-gradient(from 0deg, #ffd24a33 0 10deg, transparent 10deg 20deg);
  border-radius: 50%;
  width: 900px;
  height: 900px;
  margin: -450px 0 0 -450px;
  animation: 24s linear infinite arena-fx-spin;
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-mask-image: radial-gradient(circle, #000 18%, #0000 62%);
  mask-image: radial-gradient(circle, #000 18%, #0000 62%);
}

.arena-end-lose .arena-end-rays {
  background: repeating-conic-gradient(from 0deg, #3fc6ff29 0 10deg, transparent 10deg 20deg);
}

.arena-end-title {
  color: #fff;
  -webkit-text-stroke: 2.5px #000;
  animation: arena-fx-slam var(--fx-title, .64s) cubic-bezier(.2, 1.8, .4, 1) both;
  margin: 0;
  font-size: 66px;
  position: relative;
}

.arena-end-win .arena-end-title {
  color: var(--color-ki-300);
  text-shadow: 0 0 40px var(--color-ki-500);
}

.arena-end-lose .arena-end-title {
  color: #c6f1ff;
  text-shadow: 0 0 40px var(--color-dbs-blue);
}

.arena-end-sub {
  text-align: center;
  max-width: 28rem;
  color: var(--color-space-300);
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  position: relative;
}

.arena-end-rematch {
  min-width: 9rem;
  font-family: var(--font-impact), "Kanit", var(--font-sans, system-ui), sans-serif;
  color: var(--color-space-950);
  background: var(--color-ki-500);
  border-radius: 14px;
  padding: 12px 26px;
  font-size: 18px;
  font-style: italic;
  font-weight: 800;
  position: relative;
  box-shadow: 0 0 24px #f28c0f80;
}

@supports (color: color-mix(in lab, red, red)) {
  .arena-end-rematch {
    box-shadow: 0 0 24px color-mix(in srgb, var(--color-ki-500) 50%, transparent);
  }
}

.arena-end-rematch:disabled {
  opacity: .6;
}

.arena-end-look {
  color: var(--color-space-300);
  text-underline-offset: 3px;
  font-size: 13px;
  text-decoration: underline;
  position: relative;
}

.arena-end-error {
  color: var(--color-loss);
  margin: 0;
  font-size: 13px;
  position: relative;
}

@media (min-width: 1024px) {
  .arena-end-title {
    font-size: 120px;
  }

  .arena-end-rays {
    width: 1500px;
    height: 1500px;
    margin: -750px 0 0 -750px;
  }
}

[data-skin="anime"] {

  --lightningcss-dark: ;
  color-scheme: light;
  --color-space-50: #12161f;
  --color-space-100: #1b212d;
  --color-space-200: #2c3646;
  --color-space-300: #46566a;
  --color-space-400: #5a6b80;
  --color-space-500: #5f7087;
  --color-space-600: #12161f;
  --color-space-700: #12161f;
  --color-space-800: #fff;
  --color-space-900: #f4f8ff;
  --color-space-950: #eaf7ff;
  --color-ki-300: #ffd54a;
  --color-ki-400: #ffc02e;

[data-skin="anime"] .arena {

/* [project]/src/app/arena/preview/grounded-design.css [app-client] (css) */
.gd {
  --gd-bg: #eef5ff;
  --gd-panel: #ffffffed;
  --gd-ink: #172940;
  --gd-muted: #50647f;
  --gd-border: #b8cbe1;
  --gd-accent: #145ae4;
  --gd-good: #12785b;
  color: var(--gd-ink);
  min-height: 100vh;
  font-family: var(--font-arena),sans-serif;
  background: radial-gradient(at 40% 25%, #fff9 0%, #0000 60%), linear-gradient(135deg, #dbebff, #f7fbff 55%, #dfeeff);
  padding: 0 22px 24px;
  --arena: 1 !important;
}

.gd[data-skin="night"] {
  --gd-bg: #081322;
  --gd-panel: #111f32ed;
  --gd-ink: #e9f3ff;
  --gd-muted: #9ab0cc;
  --gd-border: #31485f;
  --gd-accent: #76cfff;
  --gd-good: #89eeb8;
  background: radial-gradient(at 45% 40%, #18335488, #0000 65%), #081322;
}

.gd button, .gd a {
  cursor: pointer;
}

.gd button:focus-visible, .gd a:focus-visible {
  outline: 3px solid var(--gd-accent);
  outline-offset: 3px;
}

.gd-assessment {
  border-bottom: 1px solid var(--gd-border);
  letter-spacing: .06em;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  font-size: 12px;
  font-weight: 700;
  display: flex;
}

.gd-assessment small {
  letter-spacing: 0;
  color: var(--gd-muted);
  margin-left: 12px;
  font-weight: 500;
}

.gd-assessment > div {
  gap: 5px;
  display: flex;
}

.gd-assessment button {
  border: 1px solid var(--gd-border);
  letter-spacing: 0;
  border-radius: 6px;
  padding: 6px 10px;
}

.gd-assessment button[aria-pressed="true"] {
  background: var(--gd-ink);
  color: var(--gd-bg);
  border-color: var(--gd-ink);
}

.gd-top {
  align-items: center;
  gap: 24px;
  max-width: 1440px;
  height: 66px;
  margin: auto;
  display: flex;
}

.gd-top a {
  color: var(--gd-muted);
  font-size: 14px;
}

.gd-top > b {
  font-size: 22px;
}

.gd-top > span {
  color: var(--gd-muted);
  font-size: 14px;
}

.gd-top i {
  margin: 0 5px;
  font-style: normal;
}

.gd-top > button {
  color: var(--gd-muted);
  margin-left: auto;
  font-size: 13px;
}

.gd-layout {
  grid-template-columns: minmax(0, 1fr) 326px;
  gap: 24px;
  max-width: 1440px;
  margin: auto;
  display: grid;
}

.gd-table {
  min-width: 0;
}

.gd-player {
  border: 1px solid var(--gd-border);
  background: var(--gd-panel);
  border-radius: 10px;
  justify-content: space-between;
  align-items: center;
  padding: 11px 16px;
  display: flex;
}

.gd-player > div:first-child {
  align-items: center;
  gap: 10px;
  display: flex;
}

.gd-avatar {
  color: #fff;
  background: #175ecc;
  border-radius: 50%;
  place-items: center;
  width: 34px;
  height: 34px;
  font-weight: 800;
  display: grid;
}

.gd-player b {
  font-size: 16px;
}

.gd-player small {
  color: var(--gd-muted);
  font-size: 12px;
  display: block;
}

.gd-stats {
  gap: 24px;
  display: flex;
}

.gd-stats > span {
  color: var(--gd-muted);
  align-items: baseline;
  gap: 6px;
  font-size: 12px;
  display: flex;
}

.gd-stats strong {
  color: var(--gd-ink);
  font-size: 24px;
  font-weight: 800;
}

.gd-stats .gd-blue strong {
  color: var(--gd-accent);
}

.gd-stats .gd-danger strong {
  color: #ec4d62;
}

.gd-side {
  padding: 12px 18px 10px;
}

.gd-zone-title {
  letter-spacing: .12em;
  color: var(--gd-muted);
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 10px;
  font-weight: 700;
  display: flex;
}

.gd-zone-title span {
  letter-spacing: 0;
  font-weight: 500;
}

.gd-field {
  align-items: center;
  gap: 34px;
  min-height: 171px;
  display: flex;
}

.gd-leader {
  border-right: 1px solid var(--gd-border);
  flex-direction: column;
  align-items: center;
  padding-right: 24px;
  display: flex;
}

.gd-leader > small {
  letter-spacing: .06em;
  color: var(--gd-muted);
  margin-top: 7px;
  font-size: 10px;
  font-weight: 700;
}

.gd-battle-cards {
  align-items: center;
  gap: 25px;
  display: flex;
}

.gd-card {
  flex-direction: column;
  align-items: center;
  max-width: 110px;
  display: flex;
}

.gd-card-label {
  text-align: center;
  max-width: 115px;
  margin-top: 5px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.15;
  display: block;
}

.gd-card-label span {
  color: var(--gd-muted);
  margin-top: 4px;
  font-size: 10px;
  font-weight: 500;
  display: block;
}

.gd-leader .gd-card-label {
  display: none;
}

.gd-zones {
  color: var(--gd-muted);
  flex-direction: column;
  gap: 9px;
  min-width: 85px;
  margin-left: auto;
  font-size: 11px;
  display: flex;
}

.gd-zones b {
  float: right;
  color: var(--gd-ink);
  margin-left: 15px;
}

.gd-zones button {
  text-align: left;
  text-underline-offset: 3px;
  text-decoration: underline;
}

.gd-moment {
  background: color-mix(in srgb,var(--gd-accent) 8%,transparent);
  border-top: 1px solid var(--gd-border);
  border-bottom: 1px solid var(--gd-border);
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  padding: 12px;
  font-size: 14px;
  display: flex;
}

.gd-moment > span {
  color: var(--gd-muted);
  font-size: 12px;
}

.gd-pulse {
  background: var(--gd-good);
  border-radius: 50%;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  display: inline-block;
}

.gd-threat {
  background: #e7465712;
  border-color: #ec4d6266;
}

.gd-threat .gd-pulse {
  background: #ec4d62;
}

.gd-you {
  margin-top: 4px;
}

.gd-hand {
  padding: 14px 14px 0;
}

.gd-hand-cards {
  scrollbar-width: thin;
  justify-content: center;
  align-items: flex-start;
  gap: 14px;
  padding-top: 8px;
  padding-bottom: 10px;
  display: flex;
  overflow-x: auto;
}

.gd-hand-card {
  border: 1px solid #0000;
  border-radius: 8px;
  flex-direction: column;
  flex: 0 0 104px;
  align-items: center;
  min-height: 181px;
  padding: 4px 4px 8px;
  display: flex;
}

.gd-picked {
  background: color-mix(in srgb,var(--gd-accent) 9%,transparent);
  border-color: var(--gd-accent);
}

.gd-used {
  opacity: .55;
}

.gd-decision {
  background: var(--gd-panel);
  border: 1px solid var(--gd-border);
  border-radius: 14px;
  align-self: start;
  padding: 22px;
  position: sticky;
  top: 12px;
  box-shadow: 0 15px 50px #182f4b0a;
}

.gd-decision-kicker {
  letter-spacing: .14em;
  color: var(--gd-accent);
  font-size: 10px;
  font-weight: 700;
}

.gd-decision h1 {
  margin: 10px 0;
  font-size: 29px;
  line-height: 1.16;
}

.gd-decision > p {
  color: var(--gd-muted);
  font-size: 14px;
  line-height: 1.45;
}

.gd-selection {
  border-top: 1px solid var(--gd-border);
  align-items: center;
  gap: 12px;
  margin-top: 18px;
  padding-top: 16px;
  display: flex;
}

.gd-selection img {
  object-fit: cover;
  border-radius: 5px;
  width: 55px;
  height: 77px;
}

.gd-selection small {
  letter-spacing: .1em;
  color: var(--gd-muted);
  font-size: 9px;
}

.gd-selection h2 {
  margin: 4px 0;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.15;
}

.gd-selection button {
  color: var(--gd-accent);
  font-size: 12px;
}

.gd-budget {
  flex-direction: column;
  gap: 4px;
  padding: 14px 0;
  display: flex;
}

.gd-budget > span {
  color: var(--gd-muted);
  font-size: 12px;
}

.gd-budget b {
  font-size: 20px;
}

.gd-budget small {
  color: var(--gd-muted);
  font-size: 12px;
  line-height: 1.4;
}

.gd-primary, .gd-secondary {
  border-radius: 8px;
  width: 100%;
  min-height: 45px;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 700;
}

.gd-primary {
  background: var(--gd-accent);
  color: var(--gd-bg);
}

.gd-primary:disabled {
  opacity: .45;
  cursor: default;
}

.gd-secondary {
  border: 1px solid var(--gd-border);
  margin-top: 8px;
}

.gd-context {
  border-top: 1px solid var(--gd-border);
  margin-top: 18px;
  padding-top: 14px;
}

.gd-context b {
  font-size: 12px;
}

.gd-context p, .gd-feed p {
  color: var(--gd-muted);
  margin-top: 5px;
  font-size: 12px;
  line-height: 1.4;
}

.gd-feed {
  margin-top: 18px;
}

.gd-feed small {
  letter-spacing: .12em;
  color: var(--gd-muted);
  font-size: 9px;
}

.gd-feed button {
  color: var(--gd-accent);
  margin-top: 5px;
  font-size: 11px;
}

.gd-notice:not(:empty) {
  background: color-mix(in srgb,var(--gd-accent) 9%,transparent);
  border-radius: 8px;
  margin-top: 12px;
  padding: 10px;
  font-size: 12px;
}

.gd-clash {
  background: #e7465710;
  border: 1px solid #e7465744;
  border-radius: 8px;
  grid-template-columns: 1fr 22px 1fr;
  align-items: center;
  gap: 5px;
  margin-top: 16px;
  padding: 12px;
  display: grid;
}

.gd-clash > div span {
  color: var(--gd-muted);
  font-size: 10px;
  display: block;
}

.gd-clash b {
  font-size: 24px;
}

.gd-clash > span {
  color: var(--gd-muted);
  font-size: 10px;
}

.gd-clash p {
  grid-column: 1 / -1;
  margin-top: 5px;
  font-size: 12px;
}

.gd-dialog {
  border: 1px solid var(--gd-border);
  background: var(--gd-panel);
  color: var(--gd-ink);
  border-radius: 16px;
  width: calc(100vw - 32px);
  max-width: 720px;
  max-height: 90vh;
  margin: auto;
  padding: 28px;
  overflow: auto;
}

.gd-dialog[open] {
  align-items: center;
  gap: 24px;
  display: flex;
}

.gd-dialog::backdrop {
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
  background: #071323b8;
}

.gd-dialog form {
  position: absolute;
  top: 10px;
  right: 14px;
}

.gd-dialog form button {
  padding: 5px;
}

.gd-dialog > img {
  object-fit: contain;
  width: 45%;
  max-height: 70vh;
}

.gd-dialog h2 {
  margin: 10px 0;
  font-size: 23px;
  font-weight: 700;
}

.gd-dialog p {
  margin: 12px 0;
  font-size: 14px;
  line-height: 1.5;
}

.gd-dialog small {
  color: var(--gd-muted);
  font-size: 12px;
}

@media (min-width: 1600px) {
  .gd-layout {
    grid-template-columns: minmax(0, 1fr) 360px;
  }

  .gd-field {
    min-height: 210px;
  }

  .gd-hand-cards {
    gap: 24px;
  }
}

@media (max-width: 1050px) {
  .gd {
    padding: 0 12px 20px;
  }

  .gd-layout {
    grid-template-columns: minmax(0, 1fr) 292px;
    gap: 14px;
  }

  .gd-decision {
    padding: 16px;
  }

  .gd-field {
    gap: 16px;
  }

  .gd-leader {
    padding-right: 12px;
  }

  .gd-battle-cards, .gd-stats {
    gap: 12px;
  }

  .gd-stats > span {
    flex-direction: column;
    gap: 0;
  }

  .gd-hand-cards {
    justify-content: flex-start;
  }
}

@media (max-width: 760px) {
  .gd {
    padding: 0 8px 16px;
  }

  .gd-assessment {
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
    font-size: 10px;
  }

  .gd-assessment small {
    margin-left: 6px;
    font-size: 9px;
  }

  .gd-assessment > div {
    width: 100%;
  }

  .gd-assessment button {
    flex: 1;
    padding: 6px 3px;
    font-size: 11px;
  }

  .gd-top {
    gap: 12px;
    height: 47px;
  }

  .gd-top > b {
    font-size: 15px;
  }

  .gd-top > span, .gd-top > button {
    font-size: 10px;
  }

  .gd-layout {
    flex-direction: column;
    gap: 10px;
    display: flex;
  }

  .gd-player {
    padding: 9px 10px;
  }

  .gd-player b {
    font-size: 13px;
  }

  .gd-player small {
    font-size: 10px;
  }

  .gd-player .gd-avatar {
    display: none;
  }

  .gd-stats {
    gap: 12px;
  }

  .gd-stats strong {
    font-size: 21px;
  }

  .gd-stats > span {
    font-size: 9px;
  }

  .gd-side {
    padding: 10px 6px 6px;
  }

  .gd-zone-title {
    letter-spacing: .08em;
    margin-bottom: 7px;
    font-size: 9px;
  }

  .gd-field {
    --arena: .78;
    gap: 17px;
    min-height: 141px;
  }

  .gd-leader {
    padding-right: 12px;
  }

  .gd-battle-cards {
    gap: 13px;
  }

  .gd-card-label {
    max-width: 80px;
    font-size: 9px;
  }

  .gd-card-label span {
    font-size: 9px;
  }

  .gd-leader > small {
    font-size: 8px;
  }

  .gd-zones {
    gap: 12px;
    min-width: 52px;
    font-size: 9px;
  }

  .gd-zones b {
    margin-left: 5px;
  }

  .gd-moment {
    padding: 9px 7px;
    font-size: 12px;
  }

  .gd-moment > span {
    text-align: center;
    font-size: 10px;
  }

  .gd-hand {
    padding: 12px 0 0;
  }

  .gd-hand-cards {
    gap: 8px;
    padding-top: 8px;
  }

  .gd-hand-card {
    --arena: .86;
    flex-basis: 85px;
    min-height: 158px;
  }

  .gd-hand-card .gd-card-label {
    font-size: 10px;
  }

  .gd-decision {
    padding: 16px;
    position: static;
  }

  .gd-decision h1 {
    font-size: 25px;
  }

  .gd-decision > p {
    font-size: 13px;
  }

  .gd-selection {
    margin-top: 12px;
    padding-top: 12px;
  }

  .gd-context, .gd-feed {
    margin-top: 13px;
  }

  .gd-dialog[open] {
    flex-direction: column;
    padding: 24px;
  }

  .gd-dialog > img {
    width: 70%;
    max-height: 50vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  .gd * {
    transition: none !important;
    animation: none !important;
  }
}

.gd:before, .gd:after {
  display: none !important;
}

.gd-mobile-summary, .gd-mobile-dock {
  display: none;
}

@media (max-width: 760px) {
  .gd {
    padding-bottom: 115px;
  }

  .gd-mobile-summary {
    background: var(--gd-panel);
    border: 1px solid var(--gd-border);
    border-radius: 8px;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 10px;
    padding: 10px;
    display: flex;
  }

  .gd-mobile-summary b {
    font-size: 16px;
  }

  .gd-mobile-summary span {
    color: var(--gd-muted);
    font-size: 11px;
  }

  .gd-mobile-summary a {
    color: var(--gd-accent);
    margin-top: 2px;
    font-size: 10px;
  }

  .gd-mobile-dock {
    z-index: 30;
    padding: 9px 12px max(12px,env(safe-area-inset-bottom));

    border-top: 1px solid var(--gd-border);
    flex-direction: column;
    gap: 5px;
