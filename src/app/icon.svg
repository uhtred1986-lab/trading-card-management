<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DBS Card Companion">
  <!--
    The card back the board already draws, at icon size: a dark navy field, a
    thin ring, and a ki-orange core. Everything stays inside the middle 60% so
    the same art survives being masked into a circle on Android.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa733" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffa733" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#090b15" />
  <circle cx="256" cy="256" r="190" fill="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2c3550" stroke-width="14" />
  <circle cx="256" cy="256" r="118" fill="#0f1220" />
  <circle cx="256" cy="256" r="118" fill="none" stroke="#f28c0f" stroke-width="6" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="62" fill="#f28c0f" />

  <!-- Four stars, as on the ball. -->
  <g fill="#0f1220">
    <circle cx="256" cy="219" r="13" />
    <circle cx="219" cy="275" r="13" />
    <circle cx="293" cy="275" r="13" />
    <circle cx="256" cy="292" r="13" />
  </g>
</svg>
